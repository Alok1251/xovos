<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Geometric Logo Mark (X) -->
  <g transform="translate(125, 90)">
    <!-- Tech Abstract X -->
    <path d="M 40 40 L 145 200 L 105 240 L 0 80 Z" fill="url(#grad1)" filter="url(#glow)"/>
    <path d="M 210 40 L 105 200 L 145 240 L 250 80 Z" fill="url(#grad2)" filter="url(#glow)"/>
    
    <!-- Center connecting nodes -->
    <circle cx="125" cy="140" r="18" fill="#ffffff" />
    <circle cx="20" cy="60" r="12" fill="#ffffff" opacity="0.8"/>
    <circle cx="230" cy="60" r="12" fill="#ffffff" opacity="0.8"/>
  </g>
  
  <!-- Typography -->
  <text x="250" y="390" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="72" letter-spacing="14" fill="#ffffff" text-anchor="middle">XOVOS</text>
  <text x="250" y="430" font-family="'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" letter-spacing="8" fill="#94a3b8" text-anchor="middle">SOFTWARE SOLUTIONS</text>
</svg>
